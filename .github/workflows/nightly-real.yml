name: nightly-real

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-smoke:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt
      - run: npm ci --prefix electron
      - run: npm --prefix electron run package:win
      - run: npm --prefix electron run smoke:packaged-ui
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-real-${{ github.run_id }}
          path: electron/test-artifacts/packaged-smoke-*/
          if-no-files-found: error
