name: quality-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-release:
    permissions:
      contents: read
    runs-on: windows-latest
    environment: production-release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-build.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Block unsigned release until SignPath is configured
        shell: powershell
        run: |
          throw "Release blocked: real SignPath Foundation project identities are not configured. Complete Task 7 before running a release."
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r backend/requirements-build.txt
      - run: npm ci --prefix electron
      - shell: powershell
        run: tools/quality-gate.ps1 -Level release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-windows-release-${{ github.sha }}
          path: |
            electron/release/Dr-Download-Setup-*-x64.exe
            artifacts/quality/
          if-no-files-found: error
