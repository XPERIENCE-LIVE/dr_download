name: quality-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-release:
    outputs:
      signed-id: ${{ steps.signed.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    environment: production-release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-build.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Validate SignPath configuration
        shell: powershell
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $required = @{
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
          }
          $missing = @($required.GetEnumerator() |
            Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } |
            ForEach-Object { $_.Key } |
            Sort-Object)
          if ($missing.Count -gt 0) {
            throw "Release blocked: missing SignPath configuration: $($missing -join ', ')"
          }
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r backend/requirements-build.txt
      - run: npm ci --prefix electron
      - shell: powershell
        run: tools/quality-gate.ps1 -Level release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: unsigned
        with:
          name: unsigned-windows-release-${{ github.sha }}
          path: electron/release/Dr-Download-Setup-*-x64.exe
          if-no-files-found: error
      - name: Link unsigned test evidence to the uploaded candidate
        shell: powershell
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.unsigned.outputs.artifact-id }}
        run: |
          $path = 'artifacts/quality/installed/evidence.json'
          $evidence = Get-Content $path -Raw | ConvertFrom-Json
          if ($evidence.status -ne 'passed' -or (Get-FileHash -LiteralPath $evidence.installer -Algorithm SHA256).Hash -ne $evidence.sha256) { throw 'Unsigned candidate changed after installation test' }
          $evidence.artifact_id = $env:CANDIDATE_ARTIFACT_ID
          $evidence | ConvertTo-Json -Depth 12 | Set-Content $path -Encoding utf8
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        id: signing
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed
      - name: Validate returned signature and origin
        shell: powershell
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.unsigned.outputs.artifact-id }}
          SIGNING_REQUEST_ID: ${{ steps.signing.outputs.signing-request-id }}
        run: |
          $installers = @(Get-ChildItem artifacts/signed -Filter 'Dr-Download-Setup-*-x64.exe' -File -Recurse)
          if ($installers.Count -ne 1) { throw 'Expected exactly one signed NSIS candidate' }
          tools/validate-release.ps1 -InstallerPath $installers[0].FullName
          Copy-Item artifacts/quality/release-artifact.json artifacts/signed/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: signed
        with:
          name: signed-windows-candidate-${{ github.sha }}
          path: artifacts/signed/
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts/quality/
          if-no-files-found: error

  signed-installation:
    needs: quality-release
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.quality-release.outputs.signed-id }}
          path: artifacts/signed
          merge-multiple: true
      - name: Test exact signed installer on a fresh runner
        shell: powershell
        env:
          CANDIDATE_ARTIFACT_ID: ${{ needs.quality-release.outputs.signed-id }}
        run: |
          $identity = Get-Content artifacts/signed/release-artifact.json -Raw | ConvertFrom-Json
          if ($identity.commit -ne $env:GITHUB_SHA -or $identity.run_id -ne $env:GITHUB_RUN_ID) { throw 'Signed installer origin mismatch' }
          $installers = @(Get-ChildItem artifacts/signed -Filter 'Dr-Download-Setup-*-x64.exe' -File -Recurse)
          if ($installers.Count -ne 1) { throw 'Expected exactly one signed NSIS candidate' }
          tools/test-installed-windows.ps1 -InstallerPath $installers[0].FullName -ExpectedSha256 $identity.sha256
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-installation-evidence-${{ github.sha }}
          path: artifacts/quality/installed/
          if-no-files-found: error
